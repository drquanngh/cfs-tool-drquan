<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ tính điểm CFS Lâm sàng - Lão khoa & Hồi sức</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .fade-in { animation: fadeIn 0.4s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen text-gray-800 font-sans">

    <div class="max-w-2xl mx-auto px-4 py-8">
        <div class="bg-blue-800 text-white p-6 rounded-t-xl shadow-md text-center">
            <h1 class="text-2xl font-bold uppercase tracking-wide">Cây phân loại CFS kỹ thuật số</h1>
            <p class="text-sm mt-2 opacity-90">Ứng dụng hỗ trợ ra quyết định lâm sàng - Đại học Dalhousie</p>
        </div>

        <div class="bg-amber-50 border-l-4 border-amber-500 p-4 shadow-sm text-sm text-amber-900">
            <p class="font-semibold">⚠️ NGUYÊN TẮC CỐ ĐỊNH:</p>
            <p>Đánh giá tình trạng <strong>SỨC KHỎE NỀN (Baseline)</strong> của bệnh nhân tại thời điểm <strong>2 tuần trước khi nhập viện</strong>. Tránh nhầm lẫn với tình trạng bệnh cấp tính hiện tại!</p>
        </div>

        <div class="bg-white p-6 rounded-b-xl shadow-md mt-1 min-h-[300px] flex flex-col justify-between">
            <div id="quiz-container" class="fade-in">
                </div>

            <div class="flex justify-between items-center mt-8 pt-4 border-t border-gray-100">
                <button id="btn-back" onclick="goBack()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg hover:bg-gray-350 transition font-medium hidden">
                    ⬅ Quay lại câu trước
                </button>
                <button id="btn-restart" onclick="restartApp()" class="ml-auto px-4 py-2 bg-red-50 text-red-600 rounded-lg hover:bg-red-100 transition font-medium">
                    🔄 Làm lại từ đầu
                </button>
            </div>
        </div>
    </div>

    <script>
        // Cấu trúc cây dữ liệu logic
        const tree = {
            start: {
                question: "Bệnh nhân có tiên lượng tử vong trong vòng 6 tháng tới do bệnh lý giai đoạn cuối (Ví dụ: Ung thư di căn...) không?",
                options: [
                    { text: "CÓ (Giai đoạn cuối)", next: "result_9" },
                    { text: "KHÔNG", next: "q1" }
                ]
            },
            q1: {
                question: "Bệnh nhân có gặp khó khăn hoặc cần người giúp đỡ trong các công việc hàng ngày (IADL) như: Nấu ăn, dọn dẹp nhẹ, mua sắm, quản lý tiền bạc không?",
                options: [
                    { text: "CÓ (Có phụ thuộc việc nhà)", next: "q1_1" },
                    { text: "KHÔNG (Hoàn toàn tự chủ việc nhà)", next: "q2" }
                ]
            },
            q1_1: {
                question: "Mức độ tự chăm sóc cá nhân (ADL cơ bản) của bệnh nhân như thế nào?",
                options: [
                    { text: "Tự tắm rửa, mặc quần áo, đi vệ sinh độc lập hoàn toàn", next: "result_5" },
                    { text: "Cần trợ giúp ít hoặc cần người nhắc nhở khi tắm rửa/mặc đồ", next: "result_6" },
                    { text: "Phụ thuộc hoàn toàn vào người khác trong mọi việc chăm sóc cá nhân", next: "result_7" }
                ]
            },
            q2: {
                question: "Bệnh nhân có tự đi bộ được bình thường không?",
                options: [
                    { text: "CÓ (Đi bộ tốt)", next: "q3" },
                    { text: "KHÔNG (Hoặc đi lại rất hạn chế)", next: "q2_1" }
                ]
            },
            q2_1: {
                question: "Bệnh nhân có thường xuyên thấy 'chậm chạp', mệt mỏi mạn tính hoặc sức khỏe làm cản trở các hoạt động thể chất nặng (như leo thang, mang vác) không?",
                options: [
                    { text: "CÓ (Có triệu chứng giới hạn hoạt động)", next: "result_4" },
                    { text: "KHÔNG", next: "result_3" }
                ]
            },
            q3: {
                question: "Ngoài việc đi bộ thông thường, bệnh nhân có tham gia hoạt động thể thao, tập thể dục, vận động cường độ trung bình - cao định kỳ không?",
                options: [
                    { text: "KHÔNG (Chỉ đi bộ hoặc sinh hoạt nhẹ)", next: "result_3" },
                    { text: "CÓ (Có tập thể thao tích cực)", next: "q3_1" }
                ]
            },
            q3_1: {
                question: "Tần suất và cường độ vận động thể thao của bệnh nhân như thế nào?",
                options: [
                    { text: "Tập thường xuyên, cường độ vừa phải để duy trì sức khỏe", next: "result_2" },
                    { text: "Tập mạnh mẽ, năng động hàng ngày hoặc xuất sắc so với lứa tuổi", next: "result_1" }
                ]
            }
        };

        // Mô tả chi tiết kết quả 9 mức CFS
        const cfsDescriptions = {
            1: { title: "CFS 1 - Rất khỏe mạnh (Very Fit)", desc: "Người năng động, tràn đầy năng lượng, thường xuyên tập thể dục cường độ cao. Thuộc nhóm khỏe mạnh nhất so với lứa tuổi." },
            2: { title: "CFS 2 - Khỏe mạnh (Well)", desc: "Người không có triệu chứng bệnh hoạt động, nhưng ít hoạt động mạnh hơn mức 1. Thường tập thể dục định kỳ hoặc năng động theo mùa." },
            3: { title: "CFS 3 - Quản lý sức khỏe tốt (Managing Well)", desc: "Các bệnh lý nền được kiểm soát tốt. Mặc dù đôi khi có triệu chứng nhưng không làm hạn chế các hoạt động sinh hoạt." },
            4: { title: "CFS 4 - Dễ bị tổn thương (Vulnerable)", desc: "Dù không phụ thuộc hoàn toàn vào người khác, nhưng các hoạt động bị giới hạn bởi triệu chứng (chậm chạp, mệt mỏi). Thường than phiền 'bị chậm lại'." },
            5: { title: "CFS 5 - Suy nhược nhẹ (Mildly Frail)", desc: "Bắt đầu phụ thuộc vào người khác trong các hoạt động sinh hoạt hàng ngày có chuẩn bị (IADL) như mua sắm, nấu ăn, dọn dẹp, quản lý tiền." },
            6: { title: "CFS 6 - Suy nhược vừa (Moderately Frail)", desc: "Cần giúp đỡ trong cả các hoạt động sinh hoạt cá nhân cơ bản, đặc biệt là việc tắm rửa, mặc quần áo (ADL trung gian)." },
            7: { title: "CFS 7 - Suy nhược nặng (Severely Frail)", desc: "Phụ thuộc hoàn toàn vào người khác để chăm sóc cá nhân (mọi khía cạnh ADL). Thường không thể tự đi lại nếu không có người hỗ trợ." },
            9: { title: "CFS 9 - Giai đoạn cuối (Terminally Ill)", desc: "Bệnh nhân có tiên lượng tử vong trong vòng 6 tháng tới do bệnh lý tiến triển giai đoạn cuối, dù trước đó mức độ suy nhược ở bậc nào." }
        };

        let historyStack = [];
        let currentNode = 'start';

        function renderNode() {
            const container = document.getElementById('quiz-container');
            const backBtn = document.getElementById('btn-back');
            
            // Quản lý hiển thị nút Quay lại
            if (historyStack.length > 0) {
                backBtn.classList.remove('hidden');
            } else {
                backBtn.classList.add('hidden');
            }

            // Kiểm tra xem nút hiện tại có phải là kết quả không
            if (currentNode.startsWith('result_')) {
                const score = currentNode.split('_')[1];
                const info = cfsDescriptions[score];
                
                container.innerHTML = `
                    <div class="text-center py-4 fade-in">
                        <div class="inline-block bg-blue-100 text-blue-800 text-4xl font-extrabold px-6 py-4 rounded-full shadow-inner mb-4">
                            CFS ${score}
                        </div>
                        <h2 class="text-xl font-bold text-gray-900 mb-2">${info.title}</h2>
                        <p class="text-gray-650 text-sm max-w-md mx-auto leading-relaxed mb-6">${info.desc}</p>
                        
                        <div class="bg-gray-50 border border-gray-200 p-4 rounded-lg max-w-md mx-auto text-left mt-4">
                            <label class="block text-xs font-semibold text-gray-500 uppercase mb-2">🩺 Nhận định lâm sàng của Bác sĩ (Expert Override):</label>
                            <p class="text-xs text-gray-500 mb-2">Nếu không đồng ý với kết quả cây logic, bác sĩ có thể điều chỉnh lại điểm thực tế:</p>
                            <select id="expert-score" onchange="overrideScore(this.value)" class="w-full bg-white border border-gray-300 rounded-md p-2 text-sm font-medium">
                                <option value="">-- Giữ nguyên điểm gợi ý (Mức ${score}) --</option>
                                ${[1,2,3,4,5,6,7,8,9].map(i => `<option value="${i}">Điều chỉnh thành: CFS ${i}</option>`).join('')}
                            </select>
                        </div>
                    </div>
                `;
                return;
            }

            // Ngược lại, hiển thị câu hỏi rẽ nhánh bình thường
            const node = tree[currentNode];
            let optionsHTML = '';
            
            node.options.forEach(opt => {
                optionsHTML += `
                    <button onclick="selectOption('${opt.next}')" class="w-full text-left bg-gray-50 border border-gray-200 p-4 rounded-xl hover:bg-blue-50 hover:border-blue-300 hover:text-blue-900 transition-all font-medium flex justify-between items-center group cursor-pointer shadow-sm">
                        <span>${opt.text}</span>
                        <span class="text-gray-400 group-hover:text-blue-500 transition-colors">➔</span>
                    </button>
                `;
            });

            container.innerHTML = `
                <div class="space-y-4 fade-in">
                    <h3 class="text-base font-semibold text-gray-900 leading-snug bg-gray-50 p-4 rounded-lg border-l-4 border-blue-600 shadow-xs">${node.question}</h3>
                    <div class="space-y-2.5 pt-2">
                        ${optionsHTML}
                    </div>
                </div>
            `;
        }

        function selectOption(nextNode) {
            historyStack.push(currentNode);
            currentNode = nextNode;
            renderNode();
        }

        function goBack() {
            if (historyStack.length > 0) {
                currentNode = historyStack.pop();
                renderNode();
            }
        }

        function restartApp() {
            historyStack = [];
            currentNode = 'start';
            renderNode();
        }

        function overrideScore(val) {
            if(val) {
                alert(`Bác sĩ đã sử dụng quyền chuyên gia để ghi đè điểm số thành: CFS ${val}.\nKết quả này sẽ được ưu tiên áp dụng vào hồ sơ lâm sàng.`);
            }
        }

        // Khởi chạy ứng dụng lần đầu
        renderNode();
    </script>
</body>
</html>
